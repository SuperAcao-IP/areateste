name: Atualizar mapa

# Toda terça-feira, 06h em Brasília (09h UTC), ou na hora pelo botão "Run workflow".
# Atualiza as camadas do mapa (unidades do Senac, cadastradas à mão, e do Senai; a coleta no site do Senac está desligada; bibliotecas com computador
# ou Wi-Fi; coordenadas dos pontos cadastrados na planilha), publica na main e abre uma issue com o
# resumo, só quando algo mudou ou alguma fonte falhou. Cada fonte é isolada: se uma falhar, mantém a
# versão anterior só dela. A primeira execução demora mais (geocodifica ~140 endereços, 1 por segundo);
# depois só os endereços novos consultam a internet.
on:
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: atualizar-mapa
  cancel-in-progress: false

jobs:
  atualizar:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Coletar unidades, geocodificar e gerar os dados do mapa
        id: mapa
        continue-on-error: true
        run: node scripts/atualizar-mapa.js --relatorio relatorio-mapa.md

      - name: Publicar na main
        if: ${{ steps.mapa.outcome == 'success' && steps.mapa.outputs.publicar == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          git commit -m "Atualização automática do mapa ($(date -u +%F))"
          git pull --rebase origin main
          git push origin HEAD:main

      # só abre issue quando houve mudança publicada, falha de alguma fonte ou falha geral
      - name: Abrir issue com o resumo
        if: ${{ always() && (steps.mapa.outcome != 'success' || steps.mapa.outputs.publicar == 'true' || steps.mapa.outputs.parcial == 'true') }}
        env:
          RESULTADO: ${{ steps.mapa.outcome }}
          PUBLICAR: ${{ steps.mapa.outputs.publicar }}
          PARCIAL: ${{ steps.mapa.outputs.parcial }}
          FONTES_COM_FALHA: ${{ steps.mapa.outputs.fontes_com_falha }}
        run: |
          if [ "$RESULTADO" = "success" ]; then
            if [ "$PUBLICAR" = "true" ]; then SITUACAO="publicado"; else SITUACAO="sem mudanças"; fi
            if [ "$PARCIAL" = "true" ]; then SITUACAO="$SITUACAO, mas FALHOU: $FONTES_COM_FALHA (versão anterior mantida)"; fi
          else
            SITUACAO="FALHOU, nada foi publicado"
          fi
          if [ ! -s relatorio-mapa.md ]; then
            echo "O script não gerou relatório. Veja o log da execução: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > relatorio-mapa.md
          fi
          echo "" >> relatorio-mapa.md
          echo "[Log da execução](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> relatorio-mapa.md
          head -c 60000 relatorio-mapa.md > corpo-issue-mapa.md
          gh label create mapa-automatico --color 1D76DB --description "Resumo da atualização automática do mapa" 2>/dev/null || true
          gh issue create --title "Mapa $(date -u +%F): ${SITUACAO}" --body-file corpo-issue-mapa.md --label mapa-automatico

      - name: Marcar a execução como falha se o script falhou
        if: ${{ steps.mapa.outcome == 'failure' }}
        run: exit 1

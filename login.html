<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acessar — SuperAção SP</title>

<style>
  /* Ajuste estas variáveis para casar com o css/ do portal */
  :root {
    --tinta:      #12241d;
    --papel:      #f2f4f1;
    --cartao:     #ffffff;
    --acento:     #1c7a4a;
    --acento-forte:#155e39;
    --borda:      #d7dcd6;
    --suave:      #5d6b64;
    --erro:       #a4232b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--papel);
    color: var(--tinta);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  .cartao {
    width: 100%;
    max-width: 420px;
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 10px;
    padding: 40px 36px 32px;
  }

  .marca {
    display: block;
    height: 44px;
    margin-bottom: 28px;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 1.4rem;
    font-weight: 650;
    letter-spacing: -0.01em;
  }

  .subtitulo {
    margin: 0 0 28px;
    color: var(--suave);
    font-size: 0.925rem;
  }

  label {
    display: block;
    margin-bottom: 7px;
    font-size: 0.825rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--suave);
  }

  input[type="email"] {
    width: 100%;
    padding: 12px 14px;
    font: inherit;
    color: var(--tinta);
    background: #fff;
    border: 1px solid var(--borda);
    border-radius: 6px;
    transition: border-color .15s;
  }

  input[type="email"]:focus {
    outline: 2px solid var(--acento);
    outline-offset: 1px;
    border-color: var(--acento);
  }

  input[type="email"][aria-invalid="true"] { border-color: var(--erro); }

  .erro {
    display: none;
    margin-top: 10px;
    color: var(--erro);
    font-size: 0.875rem;
  }

  .erro.visivel { display: block; }

  button {
    width: 100%;
    margin-top: 22px;
    padding: 13px 16px;
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--acento);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s;
  }

  button:hover { background: var(--acento-forte); }

  button:focus-visible {
    outline: 2px solid var(--tinta);
    outline-offset: 2px;
  }

  .rodape {
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px solid var(--borda);
    color: var(--suave);
    font-size: 0.8rem;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

<body>
  <main class="cartao">
    <!-- Troque pelo arquivo real dentro de img/ -->
    <img class="marca" src="img/logo.png" alt="SuperAção SP"
         onerror="this.style.display='none'">

    <h1>Plataforma de cursos</h1>
    <p class="subtitulo">Acesso restrito à equipe do programa.</p>

    <label for="email">E-mail institucional</label>
    <input type="email" id="email" name="email"
           placeholder="nome.sobrenome@fgv.br"
           autocomplete="username" autocapitalize="off"
           spellcheck="false" required>

    <p class="erro" id="erro" role="alert"></p>

    <button type="button" id="entrar">Entrar</button>

    <p class="rodape">
      Não consegue entrar? Fale com a coordenação do SuperAção SP.
    </p>
  </main>

<script src="js/auth.js"></script>
<script>
(function () {
  'use strict';

  var campo  = document.getElementById('email');
  var aviso  = document.getElementById('erro');
  var botao  = document.getElementById('entrar');

  // Só aceita nome de arquivo relativo — evita redirecionamento
  // para fora do portal via ?destino=
  function destinoSeguro() {
    var bruto = new URLSearchParams(location.search).get('destino') || '';
    if (!/^[\w.-]+\.html([?#].*)?$/.test(bruto)) return Auth.config.paginaInicial;
    if (bruto.indexOf(Auth.config.paginaLogin) === 0) return Auth.config.paginaInicial;
    return bruto;
  }

  function mostrarErro(texto) {
    aviso.textContent = texto;
    aviso.classList.add('visivel');
    campo.setAttribute('aria-invalid', 'true');
    campo.focus();
  }

  function limparErro() {
    aviso.classList.remove('visivel');
    campo.removeAttribute('aria-invalid');
  }

  function tentar() {
    var r = Auth.entrar(campo.value);
    if (!r.ok) return mostrarErro(r.erro);
    location.replace(destinoSeguro());
  }

  // Já tem sessão válida? Segue direto.
  if (Auth.sessao()) location.replace(destinoSeguro());

  botao.addEventListener('click', tentar);
  campo.addEventListener('input', limparErro);
  campo.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') tentar();
  });

  campo.focus();
})();
</script>
</body>
</html>

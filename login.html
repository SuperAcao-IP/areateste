<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acessar — Cardápio de Oportunidades | SuperAção SP</title>

<style>
  /* Tokens do portal (subconjunto usado nesta tela) */
  :root {
    --azul:        #0D5A94;
    --azul-escuro: #083a5e;
    --azul-vivo:   #1f7ec4;
    --azul-suave:  #eaf0fb;
    --ambar:       #F79620;
    --ambar-suave: #fef3df;
    --fundo:       #f4f6fb;
    --branco:      #ffffff;
    --texto:       #29303d;
    --texto-suave: #5a6473;
    --linha:       #e2e8f3;
    --linha-forte: #cdd6e6;
    --erro:        #a4232b;
    --sombra:      0 1px 2px rgba(16,32,64,.06), 0 8px 24px rgba(16,32,64,.07);
    --raio:        16px;
    --raio-sm:     11px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--fundo);
    color: var(--texto);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  .cartao {
    width: 100%;
    max-width: 420px;
    background: var(--branco);
    border: 1px solid var(--linha);
    border-radius: var(--raio);
    box-shadow: var(--sombra);
    padding: 40px 36px 32px;
  }

  .marca {
    display: block;
    height: 44px;
    margin-bottom: 28px;
  }

  h1 {
    margin: 0 0 18px;
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--azul);
  }

  .aviso-acesso {
    margin: 0 0 26px;
    padding: 14px 16px;
    background: var(--azul-suave);
    border-left: 3px solid var(--azul);
    border-radius: 0 var(--raio-sm) var(--raio-sm) 0;
    font-size: 0.9rem;
  }

  .aviso-acesso strong {
    display: block;
    margin-bottom: 3px;
    font-weight: 650;
    color: var(--azul-escuro);
  }

  label {
    display: block;
    margin-bottom: 7px;
    font-size: 0.825rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--texto-suave);
  }

  input[type="email"] {
    width: 100%;
    padding: 12px 14px;
    font: inherit;
    color: var(--texto);
    background: var(--branco);
    border: 1px solid var(--linha-forte);
    border-radius: var(--raio-sm);
    transition: border-color .15s;
  }

  input[type="email"]:focus {
    outline: 2px solid var(--azul-vivo);
    outline-offset: 1px;
    border-color: var(--azul-vivo);
  }

  input[type="email"][aria-invalid="true"] { border-color: var(--erro); }

  .erro {
    display: none;
    margin-top: 10px;
    color: var(--erro);
    font-size: 0.875rem;
  }

  .erro.visivel { display: block; }

  button {
    width: 100%;
    margin-top: 22px;
    padding: 13px 16px;
    font: inherit;
    font-weight: 600;
    color: var(--branco);
    background: var(--azul);
    border: 0;
    border-radius: var(--raio-sm);
    cursor: pointer;
    transition: background .15s;
  }

  button:hover { background: var(--azul-escuro); }

  button:focus-visible {
    outline: 2px solid var(--texto);
    outline-offset: 2px;
  }

  .rodape {
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px solid var(--linha);
    color: var(--texto-suave);
    font-size: 0.8rem;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

<body>
  <main class="cartao">
    <!-- Troque pelo arquivo real dentro de img/ -->
    <img class="marca" src="img/logo.png" alt="SuperAção SP"
         onerror="this.style.display='none'">

    <h1>Cardápio de Oportunidades</h1>

    <p class="aviso-acesso">
      <strong>Acesso exclusivo</strong>
      Esta plataforma é destinada a supervisores e agentes do
      Programa SuperAção. O acesso é feito com e-mail institucional.
    </p>

    <label for="email">E-mail institucional</label>
    <input type="email" id="email" name="email"
           placeholder="nome.sobrenome@fgv.br"
           autocomplete="username" autocapitalize="off"
           spellcheck="false" required>

    <p class="erro" id="erro" role="alert"></p>

    <button type="button" id="entrar">Entrar</button>

    <p class="rodape">
      Não consegue entrar? Fale com a coordenação do SuperAção SP.
    </p>
  </main>

<script src="js/auth.js"></script>
<script>
(function () {
  'use strict';

  var campo  = document.getElementById('email');
  var aviso  = document.getElementById('erro');
  var botao  = document.getElementById('entrar');

  // Só aceita nome de arquivo relativo — evita redirecionamento
  // para fora do portal via ?destino=
  function destinoSeguro() {
    var bruto = new URLSearchParams(location.search).get('destino') || '';
    if (!/^[\w.-]+\.html([?#].*)?$/.test(bruto)) return Auth.config.paginaInicial;
    if (bruto.indexOf(Auth.config.paginaLogin) === 0) return Auth.config.paginaInicial;
    return bruto;
  }

  function mostrarErro(texto) {
    aviso.textContent = texto;
    aviso.classList.add('visivel');
    campo.setAttribute('aria-invalid', 'true');
    campo.focus();
  }

  function limparErro() {
    aviso.classList.remove('visivel');
    campo.removeAttribute('aria-invalid');
  }

  function tentar() {
    var r = Auth.entrar(campo.value);
    if (!r.ok) return mostrarErro(r.erro);
    location.replace(destinoSeguro());
  }

  // Já tem sessão válida? Segue direto.
  if (Auth.sessao()) location.replace(destinoSeguro());

  botao.addEventListener('click', tentar);
  campo.addEventListener('input', limparErro);
  campo.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') tentar();
  });

  campo.focus();
})();
</script>
</body>
</html>
